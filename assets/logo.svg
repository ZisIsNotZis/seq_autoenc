<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">seq_autoenc</title>
  <desc id="desc">An hourglass of token bars shrinking to a bottleneck and expanding again, drawn in cyan to magenta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#151b36"/>
    </linearGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="80" y1="24" x2="80" y2="136">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.30" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="0.78" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="152" height="152" rx="34" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="151" height="151" rx="33.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="80" cy="80" r="62" fill="url(#glow)"/>

  <!-- 8 tokens -->
  <g fill="url(#beam)">
    <rect x="34" y="18" width="9" height="9" rx="2.5"/>
    <rect x="46" y="18" width="9" height="9" rx="2.5"/>
    <rect x="58" y="18" width="9" height="9" rx="2.5"/>
    <rect x="70" y="18" width="9" height="9" rx="2.5"/>
    <rect x="82" y="18" width="9" height="9" rx="2.5"/>
    <rect x="94" y="18" width="9" height="9" rx="2.5"/>
    <rect x="106" y="18" width="9" height="9" rx="2.5"/>
    <rect x="118" y="18" width="9" height="9" rx="2.5"/>
  </g>

  <!-- 5 tokens -->
  <g fill="url(#beam)">
    <rect x="34" y="37" width="14" height="9" rx="3"/>
    <rect x="53" y="37" width="14" height="9" rx="3"/>
    <rect x="72" y="37" width="16" height="9" rx="3"/>
    <rect x="93" y="37" width="14" height="9" rx="3"/>
    <rect x="112" y="37" width="14" height="9" rx="3"/>
  </g>

  <!-- 3 tokens -->
  <g fill="url(#beam)">
    <rect x="42" y="60" width="20" height="11" rx="3.5"/>
    <rect x="70" y="60" width="20" height="11" rx="3.5"/>
    <rect x="98" y="60" width="20" height="11" rx="3.5"/>
  </g>

  <!-- bottleneck -->
  <rect x="64" y="75" width="32" height="13" rx="4.5" fill="url(#beam)"/>

  <!-- 3 tokens -->
  <g fill="url(#beam)">
    <rect x="42" y="94" width="20" height="11" rx="3.5"/>
    <rect x="70" y="94" width="20" height="11" rx="3.5"/>
    <rect x="98" y="94" width="20" height="11" rx="3.5"/>
  </g>

  <!-- 5 tokens -->
  <g fill="url(#beam)">
    <rect x="34" y="113" width="14" height="9" rx="3"/>
    <rect x="53" y="113" width="14" height="9" rx="3"/>
    <rect x="72" y="113" width="16" height="9" rx="3"/>
    <rect x="93" y="113" width="14" height="9" rx="3"/>
    <rect x="112" y="113" width="14" height="9" rx="3"/>
  </g>

  <!-- 8 tokens -->
  <g fill="url(#beam)">
    <rect x="34" y="133" width="9" height="9" rx="2.5"/>
    <rect x="46" y="133" width="9" height="9" rx="2.5"/>
    <rect x="58" y="133" width="9" height="9" rx="2.5"/>
    <rect x="70" y="133" width="9" height="9" rx="2.5"/>
    <rect x="82" y="133" width="9" height="9" rx="2.5"/>
    <rect x="94" y="133" width="9" height="9" rx="2.5"/>
    <rect x="106" y="133" width="9" height="9" rx="2.5"/>
    <rect x="118" y="133" width="9" height="9" rx="2.5"/>
  </g>
</svg>
